# Oyun sunucusu (Server/Main.rs): Linux x86_64 ve ARM64 (Oracle Cloud Ampere gibi) için derler, kurulum
# betikleriyle birlikte paketler. Çıktı: Actions → bu iş → Artifacts → zenvex-server-<mimari>.tar.gz
name: Oyun Sunucusu

on:
  push:
    paths:
      - "Server/**"
      - ".github/workflows/server.yml"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Server
      # sıfır uyarı: Rust tarafında tek bir clippy uyarısı bile derlemeyi durdurur
      - name: Clippy
        working-directory: Server
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test ve derle
        working-directory: Server
        run: |
          cargo test --release --locked
          cargo build --release --locked
      - name: Yük testi (100 bot)
        working-directory: Server
        run: |
          ALLOW_GUESTS=1 BIND=127.0.0.1:7790 HEALTH_BIND=127.0.0.1:7791 ./target/release/zenvex_server &
          sleep 1
          ./target/release/zenvex_server loadtest ws://127.0.0.1:7790 100 15
          curl -s 127.0.0.1:7791
      - name: Paketle
        run: |
          mkdir -p dist/zenvex-server
          cp Server/target/release/zenvex_server Server/Install.sh Server/Update.sh Server/zenvex-server.service dist/zenvex-server/
          tar -C dist -czf zenvex-server-${{ matrix.arch }}.tar.gz zenvex-server
      - uses: actions/upload-artifact@v7
        with:
          name: zenvex-server-${{ matrix.arch }}
          path: zenvex-server-${{ matrix.arch }}.tar.gz
